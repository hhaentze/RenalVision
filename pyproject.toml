[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renal-vision"
version = "0.1.0"
description = "The Modular Lesion Analysis Platform"
authors = [{ name = "RUMC Onco AI & TUM AI in Radiology Groups" }]
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    # Core AI/Medical
    "monai>=1.3.0",   # 1.3+ has better Py3.11/3.12 support
    "torch>=2.0.0",   # 2.0+ is required for Python 3.11+ stability
    "nibabel>=5.1.0", # 5.x series handles new numpy versions better

    # Data Science Stack
    "numpy>=1.26.0,<2.0.0", # CRITICAL: Fixes Py3.12 support but prevents breakage from Numpy 2.0
    "scikit-learn>=1.3.0",
    "pandas>=1.5.3",        # 2.0 provides significant perf improvements
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.0.0",

    # Visualization & Utils
    "matplotlib>=3.7.0",
    "graphviz>=0.20.1",
    "tqdm>=4.65.0",
    "scikit-image>=0.21.0", # Patches several vulnerabilities in older versions
    "pyarrow>=17.0.0",
    "seaborn>=0.13.2",
    "prettytable",
]

[project.optional-dependencies]
dev = [
    # jupyter
    "ipykernel>=6.0.0",

    # Linting and Formatting
    "ruff>=0.14.0,<0.15.0",
    "nbqa>=1.7.0",
    "pre-commit>=3.3.0",

    # Typing
    "mypy>=1.4.0",
    "types-tqdm",

    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

radiomics = ["pyradiomics>=3.0.1"]

mevis = ["medicalmultitaskmodeling==1.0.4"]

# UNICORN uses the newer mmm.api.M3Model API (>=1.6.1), which removed the
# NativeBlocks API used by the `mevis` extra above -- so these two are mutually
# exclusive in one environment.
mevis_unicorn = ["medicalmultitaskmodeling>=1.6.1", "m3-sdk"]

fmcib = ["foundation-cancer-image-biomarker==1.0.0"]

ctfm = ["lighter-zoo==0.1.3"]

spectre = [
    "spectre-fm>=0.2.1",
    "timm>=1.0.0",       # spectre-fm imports timm.layers (only exists in timm 0.9+); pin to be safe
]

end2end = ["pytorch_lightning"]


[project.scripts]
rv = "renal_vision.cli:main"
renal-vision = "renal_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"renal_vision.bundles" = ["*/*.pkl"]

############### Linting & Formatting ###############

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [".git", ".ruff_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
extend-select = ["I", "F401"] # fix import order, remove unused imports
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["renal_vision"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F841", "E402", "PLR0913"]


############### Type Checking ###############

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Crucial for ML libs (torch, monai) lacking stubs
disable_error_code = [
    "no-any-return",
] # Dangerous! By disabling this we open the door for type leaks. However, maintaining this rule is challenging.
exclude = "tests/"

############### Testing & Coverage ###############

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov --cov-report=xml --cov-report=html --cov-report=term"
filterwarnings = [
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
markers = ["integration", "local_only"]

[tool.coverage.run]
branch = true
source = ["renal_vision"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0      # CI fails if coverage is below 0%
