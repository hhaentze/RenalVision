[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyst-classifier"
version = "0.1.0"
description = "CT-based classifier for distinguishing cysts from solid tumors"
authors = [{ name = "RUMC Onco AI & TUM AI in Radiology Groups" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "monai>=1.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "nibabel>=3.2.0",
    "torch>=1.10.0",
    "statsmodels>=0.13.0",
    "graphviz>=0.20.0",
    "tqdm",
    "scikit-image",
]

[project.optional-dependencies]
dev = [
    "black",
    "black[jupyter]",
    "ruff",
    "ruff[jupyter]",
    "mypy",           # static typechecks
    "nbqa",           # Tool to run linters on notebooks
    "ipykernel",
]

[project.scripts]
cyst-classifier = "cyst_classifier.main:main"

############### Linting ###############

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".ruff_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
extend-select = ["I"]     # enable import sorting
ignore = ["E501", "E741"] # ignore line-length, ambitious variable names

[tool.ruff.lint.isort]
known-first-party = ["cyst_classifier"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "F841",    # unused variable - common in exploration
    "E402",    # module level import not at top - common in notebooks
    "PLR0913", # too many arguments - common in notebook prototyping
]

[tool.black]
line-length = 100
target-version = ["py311"]
