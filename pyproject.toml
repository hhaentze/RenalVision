[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renal-vision"
version = "0.1.0"
description = "The Modular Lesion Analysis Platform"
authors = [{ name = "RUMC Onco AI & TUM AI in Radiology Groups" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "monai>=1.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "nibabel>=3.2.0",
    "torch>=1.10.0",
    "statsmodels>=0.13.0",
    "graphviz>=0.20.0",
    "tqdm",
    "scikit-image",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "black",
    "black[jupyter]",
    "ruff",
    "ruff[jupyter]",
    "mypy",           # static typechecks
    "nbqa",           # Tool to run linters on notebooks
    "ipykernel",
    "pytest",
    "pytest-cov",
    "types-tqdm",     # (stubs for mypy)
    "pre-commit",
]

[project.scripts]
rv = "renal_vision.cli:main"
renal-vision = "renal_vision.cli:main"

############### Linting & Formatting ###############

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [".git", ".ruff_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
extend-select = ["I","F401"] # fix import order, remove unused imports
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["renal_vision"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F841", "E402", "PLR0913"]

[tool.black]
line-length = 100
target-version = ["py311"]

############### Type Checking ###############

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Crucial for ML libs (torch, monai) lacking stubs
disable_error_code = ["no-any-return"] # Dangerous! By disabling this we open the door for type leaks. However, maintaining this rule is challenging.

############### Testing & Coverage ###############

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--verbose"

[tool.coverage.run]
branch = true
source = ["modeling"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0     # CI fails if coverage is below 0%
