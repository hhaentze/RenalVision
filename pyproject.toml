[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renal-vision"
version = "0.1.0"
description = "The Modular Lesion Analysis Platform"
authors = [{ name = "RUMC Onco AI & TUM AI in Radiology Groups" }]
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    # Core AI/Medical
    "monai>=1.3.0",           # 1.3+ has better Py3.11/3.12 support
    "torch>=2.0.0",           # 2.0+ is required for Python 3.11+ stability
    "nibabel>=5.1.0",         # 5.x series handles new numpy versions better
    "pyradiomics>=3.0.1",     # Doesnt have pre-build wheels for python >= 3.10. We need to install this manually (check Makefile)

    # Data Science Stack
    "numpy>=1.26.0,<2.0.0",   # CRITICAL: Fixes Py3.12 support but prevents breakage from Numpy 2.0
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",          # 2.0 provides significant perf improvements
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.0.0",

    # Visualization & Utils
    "matplotlib>=3.7.0",
    "graphviz>=0.20.1",
    "tqdm>=4.65.0",
    "scikit-image>=0.21.0",   # Patches several vulnerabilities in older versions
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    # jupyter
    "ipykernel>=6.0.0",

    # Linting and Formatting
    "ruff>=0.1.0",
    "nbqa>=1.7.0",
    "pre-commit>=3.3.0",

    # Typing
    "mypy>=1.4.0",
    "types-tqdm",

    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
rv = "renal_vision.cli:main"
renal-vision = "renal_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"renal_vision.bundles" = ["*/*.pkl"]

############### Linting & Formatting ###############

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [".git", ".ruff_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
extend-select = ["I","F401"] # fix import order, remove unused imports
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["renal_vision"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F841", "E402", "PLR0913"]


############### Type Checking ###############

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Crucial for ML libs (torch, monai) lacking stubs
disable_error_code = ["no-any-return"] # Dangerous! By disabling this we open the door for type leaks. However, maintaining this rule is challenging.

############### Testing & Coverage ###############

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov --cov-report=xml --cov-report=html --cov-report=term"
filterwarnings = [
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["renal_vision"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0     # CI fails if coverage is below 0%
