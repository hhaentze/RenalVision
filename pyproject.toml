[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kits-classifier"
version = "0.1.0"
description = "CT-based classifier for distinguishing cysts from solid tumors"
authors = [{name = "RUMC Onco AI & TUM AI in Radiology Groups"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "monai>=1.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "nibabel>=3.2.0",
    "torch>=1.10.0",
    "tqdm",
    "scikit-image",
]

[project.scripts]
kits-classifier = "kits_classifier.main:main"
